{% set prefix = item.id if item else 'new' %}
<div class="form-grid"><div class="field"><label for="name-{{ prefix }}">ชื่อเมนู</label><input id="name-{{ prefix }}" name="name" value="{{ item.name if item else '' }}" maxlength="150" required></div><div class="field"><label for="price-{{ prefix }}">ราคา (บาท)</label><input id="price-{{ prefix }}" name="price" value="{{ item.price if item else '' }}" type="number" min="0" max="100000" step="0.01" required></div><div class="field"><label for="category-{{ prefix }}">หมวดอาหาร</label><input id="category-{{ prefix }}" name="category" value="{{ item.category if item else 'อาหาร' }}" maxlength="80" required></div><div class="field"><label for="sort-{{ prefix }}">ลำดับที่แสดง</label><input id="sort-{{ prefix }}" name="sort_order" value="{{ item.sort_order or 0 if item else 0 }}" type="number" min="0" max="10000" required></div></div><div class="field"><label for="description-{{ prefix }}">รายละเอียดเมนู</label><textarea id="description-{{ prefix }}" name="description" maxlength="1000" placeholder="ส่วนประกอบ ขนาด หรือข้อมูลที่ลูกค้าควรรู้">{{ item.description or '' if item else '' }}</textarea></div><div class="field"><label for="image-{{ prefix }}">ลิงก์รูปเมนู (ไม่บังคับ)</label><input id="image-{{ prefix }}" name="image_url" type="url" value="{{ item.image_url or '' if item else '' }}" placeholder="https://…" maxlength="2048"><span class="help">ใช้ลิงก์ HTTPS ของภาพที่คุณมีสิทธิ์ใช้งาน</span></div>
<div class="field" data-options-editor><span class="field-label">ตัวเลือกเพิ่มเติม</span><p class="help">เช่น ไข่ดาว +10 บาท หรือเพิ่มข้าว +5 บาท ลูกค้าเลือกได้หลายรายการ</p><input type="hidden" name="options" value="{{ (item.options or [] if item else [])|tojson|forceescape }}"><div data-option-list></div><button class="btn btn-secondary btn-small" type="button" data-add-option hidden>+ เพิ่มตัวเลือก</button><noscript><p class="help">เปิด JavaScript เพื่อแก้ไขตัวเลือกเพิ่มเติม ตัวเลือกเดิมจะยังคงอยู่เมื่อบันทึกเมนู</p></noscript></div>
